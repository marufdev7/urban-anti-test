# SPA fallback + API proxy for the production UrbanMend client container.
# The SPA is static; every request under /api is forwarded to the Django API.
# API_UPSTREAM is interpolated by nginx at container start via envsubst in the
# entrypoint override below.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cache hashed static assets aggressively; index.html stays fresh.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        # nginx entrypoint envsubst replaces this from $API_UPSTREAM.
        # No trailing slash on proxy_pass: the full /api/v1/... path must be
        # forwarded unchanged to the backend.
        proxy_pass ${API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
