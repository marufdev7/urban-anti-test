# Local developer overrides — applied automatically on top of docker-compose.yml by
# `docker compose up`. LOCAL ONLY: nothing here may reach a deployed environment.
#
# Two jobs: mount source for hot reload, and install the dev dependency set
# (pytest/ruff/mypy) which the production runtime stage deliberately excludes.

services:
  api:
    build:
      target: dev
    image: urbenmend:dev
    # --reload restarts uvicorn on source change. Never use in deployment.
    command:
      [
        "uvicorn", "urbenmend.asgi:application",
        "--host", "0.0.0.0", "--port", "8080",
        "--reload", "--reload-dir", "/app",
      ]
    volumes:
      # Bind-mount source over the image copy so edits apply without a rebuild.
      - .:/app
      # Anonymous volumes keep container-generated output from being clobbered by
      # the bind mount above (and from leaking into the Windows host).
      - /app/staticfiles
      - /app/mediafiles
    stdin_open: true   # `docker attach` for pdb/breakpoint()
    tty: true

  worker:
    build:
      target: dev
    image: urbenmend:dev
    # Celery has no built-in reloader; the source mount still avoids image rebuilds,
    # but a code change needs `docker compose restart worker` to take effect.
    volumes:
      - .:/app
      - /app/staticfiles
      - /app/mediafiles

  # T10.4 load generator. Locust lives in the dev dependency set, so `target: dev` is what makes
  # it present at all — the production runtime stage deliberately excludes it.
  #
  # ⚠️ `profiles` is what keeps this out of everyone's way: a service with a profile is started
  # only by `--profile loadtest`, so plain `docker compose up` never launches a load generator
  # against the dev stack. Removing the profile turns every `up` into a load test.
  #
  # Headless by design — no published ports and no web UI, so a run is one reproducible command
  # whose exit code is the NFR-2 gate. See docs/09-operations.md § T10.4 for the full procedure
  # (seed first, raise the submission throttles for the run only, restore them after).
  #
  #   docker compose --profile loadtest run --rm loadgen \
  #     --headless -u 25 -r 5 -t 5m --csv .loadtest/a7
  loadgen:
    profiles: ["loadtest"]
    build:
      context: .
      target: dev
    image: urbenmend:dev
    # ⚠️ No `command:` default on purpose. Every run states its own concurrency, duration and
    # `--csv` prefix, and a baked-in default would silently decide the shape of a recorded result.
    entrypoint: ["locust"]
    environment:
      # ⚠️ Locust reads `LOCUST_HOST` as `--host`, and `api` must be listed in
      # DJANGO_ALLOWED_HOSTS or every request is a 400 — which a load run reports as a very fast
      # failure rather than a misconfiguration. See .env.example.
      LOCUST_HOST: http://api:8080
      # Set so a run need not repeat `-f`. The gate's own budget (LOADTEST_P95_MS) is deliberately
      # NOT set here: it defaults to NFR-2's 2000 ms in the locustfile, and the runbook overrides
      # it per run (LOADTEST_P95_MS=1 is the step that proves the gate can fail).
      LOCUST_LOCUSTFILE: urbenmend/platform/loadtest/locustfile.py
    env_file:
      - .env.local
    volumes:
      # Source and the seeded handoff files (.loadtest/) both come from the repo mount. The
      # sessions CSV holds live session keys, which is why .loadtest/ is git-ignored.
      - .:/app
    depends_on:
      - api
